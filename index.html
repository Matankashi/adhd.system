<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = (window.Recharts || {});

// ── Firebase persistence (replaces window.storage) ───────────────────────────
const _db = firebase.database();
let USER = "matan";

const sget = (key, fallback) => new Promise(res =>
  _db.ref(`adhd/${USER}/${key}`).once('value', snap => {
    if (!snap.exists()) { res(fallback); return; }
    const val = snap.val();
    if (Array.isArray(fallback)) {
      res(Array.isArray(val) ? val : (val && typeof val === 'object' ? Object.values(val) : fallback));
    } else {
      res(val !== null ? val : fallback);
    }
  })
);
const sset = (key, val) => _db.ref(`adhd/${USER}/${key}`).set(val);

// ── helpers ───────────────────────────────────────────────────────────────────
const TODAY = new Date().toISOString().split("T")[0];
const YESTERDAY = (() => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().split("T")[0]; })();
const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
const pad = n => String(n).padStart(2, "0");
const daysSince = dateStr => dateStr ? Math.floor((Date.now() - new Date(dateStr)) / 86400000) : 0;

// ── design tokens ─────────────────────────────────────────────────────────────
const C = {
  purple: "#6D28D9", purpleLight: "#EDE9FE", purpleMid: "#8B5CF6",
  green: "#059669", greenLight: "#D1FAE5",
  amber: "#D97706", amberLight: "#FEF3C7",
  red: "#DC2626", redLight: "#FEE2E2",
  blue: "#2563EB", blueLight: "#DBEAFE",
  teal: "#0D9488", tealLight: "#CCFBF1",
  orange: "#EA580C", orangeLight: "#FED7AA",
  gray: "#6B7280", grayLight: "#F3F4F6", grayBorder: "#E5E7EB",
  text: "#111827", textMid: "#374151", textLight: "#6B7280",
  white: "#FFFFFF", bg: "#F9FAFB",
};
const card = { background: C.white, borderRadius: 14, padding: 16, marginBottom: 12, border: `1px solid ${C.grayBorder}` };
const inp = { width: "100%", border: `1.5px solid ${C.grayBorder}`, borderRadius: 8, padding: "9px 12px", fontSize: 14, outline: "none", boxSizing: "border-box", direction: "rtl", background: C.white, color: C.text, fontFamily: "inherit" };
const btn = (bg, col) => ({ background: bg || C.purple, color: col || C.white, border: "none", borderRadius: 8, padding: "10px 16px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" });

const CTX_OPTS = [
  { v: "computer", l: "💻 מחשב" }, { v: "phone", l: "📞 טלפון" },
  { v: "home", l: "🏠 בית" }, { v: "outside", l: "🚗 חוץ" }, { v: "shopping", l: "🛒 קניות" }
];
const TIME_OPTS = [{ v: 5, l: "5′" }, { v: 10, l: "10′" }, { v: 15, l: "15′" }, { v: 25, l: "25′" }, { v: 50, l: "50′" }];
const ENERGY_OPTS = [{ v: "low", l: "🔋 נמוכה" }, { v: "medium", l: "⚡ בינונית" }, { v: "high", l: "🚀 גבוהה" }];
const PROJ_STATUS = { active: { l: "פעיל", c: C.green }, waiting: { l: "ממתין", c: C.amber }, frozen: { l: "מוקפא", c: C.gray } };

// ── shared components ─────────────────────────────────────────────────────────
function Stars({ value, onChange, max = 5 }) {
  return <div style={{ display: "flex", gap: 4 }}>{Array.from({ length: max }).map((_, i) => (
    <button key={i} onClick={() => onChange(i + 1)} style={{ fontSize: 20, background: "none", border: "none", cursor: "pointer", opacity: i < value ? 1 : 0.18, padding: 0, lineHeight: 1 }}>★</button>
  ))}</div>;
}
function Chip({ label, color, bg, small }) {
  return <span style={{ background: bg || color + "18", color, fontSize: small ? 10 : 11, fontWeight: 700, padding: small ? "2px 6px" : "2px 8px", borderRadius: 20, border: `1px solid ${color}28`, whiteSpace: "nowrap" }}>{label}</span>;
}
function Sel({ value, onChange, opts, placeholder }) {
  return (
    <select value={value != null ? value : ""} onChange={e => onChange(e.target.value)}
      style={{ border: `1.5px solid ${C.grayBorder}`, borderRadius: 8, padding: "7px 10px", fontSize: 13, outline: "none", background: C.white, direction: "rtl", color: (value != null && value !== "") ? C.text : C.textLight, cursor: "pointer", fontFamily: "inherit" }}>
      {placeholder && <option value="">{placeholder}</option>}
      {opts.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  );
}

// ── ProjectModal ──────────────────────────────────────────────────────────────
function ProjectModal({ project, onClose, onSave }) {
  const [p, setP] = useState(() => project || { id: uid(), name: "", outcome: "", done_definition: "", why: "", deadline: "", not_in_scope: "", blockers: "", reference: "", status: "active", milestones: [], createdAt: new Date().toISOString() });
  const [mText, setMText] = useState("");
  const upd = k => v => setP(prev => ({ ...prev, [k]: v }));
  const addMilestone = () => {
    if (!mText.trim()) return;
    setP(prev => ({ ...prev, milestones: [...(prev.milestones || []), { id: uid(), text: mText.trim(), due: "", done_def: "", completed: false }] }));
    setMText("");
  };
  const updM = (id, k, v) => setP(prev => ({ ...prev, milestones: prev.milestones.map(m => m.id === id ? { ...m, [k]: v } : m) }));
  const delM = id => setP(prev => ({ ...prev, milestones: prev.milestones.filter(m => m.id !== id) }));

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 12 }} onClick={onClose}>
      <div style={{ background: C.white, borderRadius: 16, padding: 20, width: "100%", maxWidth: 480, maxHeight: "92vh", overflowY: "auto", direction: "rtl" }} onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 17, fontWeight: 800, color: C.text, marginBottom: 16 }}>📁 {project ? "ערוך פרויקט" : "פרויקט חדש"}</div>
        {[
          { k: "name", label: "שם הפרויקט *", ph: "לדוגמה: מעבר דירה / הסמכה מקצועית" },
          { k: "outcome", label: "תוצאה רצויה *", ph: "מה בדיוק ייחשב הושלם?" },
          { k: "done_definition", label: "הגדרת \"בוצע\" *", ph: "מצב ברור שאדע שסיימתי..." },
          { k: "why", label: "למה זה חשוב", ph: "המניע מאחורי הפרויקט..." },
          { k: "not_in_scope", label: "מה לא נכנס לפרויקט", ph: "גבולות ברורים..." },
          { k: "blockers", label: "חסמים / תלויות", ph: "מה עלול לעצור אותי?" },
          { k: "reference", label: "מיקום חומרי רקע", ph: "Google Drive / תיקייה..." },
        ].map(f => (
          <div key={f.k} style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 4 }}>{f.label}</div>
            <input value={p[f.k] || ""} onChange={e => upd(f.k)(e.target.value)} placeholder={f.ph} style={{ ...inp, fontSize: 13 }} />
          </div>
        ))}
        <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 4 }}>דדליין</div>
            <input type="date" value={p.deadline || ""} onChange={e => upd("deadline")(e.target.value)} style={{ ...inp, direction: "ltr", fontSize: 13 }} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 4 }}>סטטוס</div>
            <Sel value={p.status} onChange={upd("status")} opts={Object.entries(PROJ_STATUS).map(([v, s]) => ({ v, l: s.l }))} />
          </div>
        </div>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginTop: 14, marginBottom: 4 }}>📍 אבני דרך (3–7)</div>
        <div style={{ fontSize: 11, color: C.textLight, marginBottom: 8 }}>כל אבן דרך = נקודת ביניים שניתן לבדוק</div>
        {(p.milestones || []).map((m, i) => (
          <div key={m.id} style={{ background: m.completed ? C.greenLight : C.grayLight, borderRadius: 10, padding: 10, marginBottom: 6, border: `1px solid ${m.completed ? C.green + "30" : C.grayBorder}` }}>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <input value={m.text} onChange={e => updM(m.id, "text", e.target.value)} style={{ flex: 1, fontSize: 13, fontWeight: 600, color: m.completed ? C.green : C.text, textDecoration: m.completed ? "line-through" : "none", border: "none", borderBottom: `1px dashed ${C.grayBorder}`, background: "transparent", outline: "none", fontFamily: "inherit", direction: "rtl", padding: "2px 0" }} />
              <button onClick={() => updM(m.id, "completed", !m.completed)} title={m.completed ? "הסר סימון" : "סמן כהושלם"} style={{ fontSize: 12, background: m.completed ? C.green : "transparent", color: m.completed ? "#fff" : C.textLight, border: `1px solid ${m.completed ? C.green : C.grayBorder}`, borderRadius: 6, padding: "2px 8px", cursor: "pointer", flexShrink: 0 }}>{m.completed ? "✓ הושלם" : "סמן ✓"}</button>
              <button onClick={() => { if (window.confirm(`למחוק את "${m.text}"?`)) delM(m.id); }} style={{ background: "none", border: "none", color: C.grayBorder, cursor: "pointer", fontSize: 14 }}>✕</button>
            </div>
            {!m.completed && (
              <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                <input value={m.due || ""} type="date" onChange={e => updM(m.id, "due", e.target.value)} style={{ border: `1px solid ${C.grayBorder}`, borderRadius: 6, padding: "4px 8px", fontSize: 11, direction: "ltr", outline: "none", background: C.white }} />
                <input value={m.done_def || ""} onChange={e => updM(m.id, "done_def", e.target.value)} placeholder="מה ייחשב הושלם?" style={{ flex: 1, border: `1px solid ${C.grayBorder}`, borderRadius: 6, padding: "4px 8px", fontSize: 11, direction: "rtl", outline: "none", background: C.white, fontFamily: "inherit" }} />
              </div>
            )}
          </div>
        ))}
        {(p.milestones || []).length < 7 && (
          <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
            <input value={mText} onChange={e => setMText(e.target.value)} onKeyDown={e => e.key === "Enter" && addMilestone()} placeholder="הוסף אבן דרך..." style={{ ...inp, fontSize: 13, flex: 1 }} />
            <button onClick={addMilestone} style={{ ...btn(), padding: "7px 14px", flexShrink: 0 }}>+</button>
          </div>
        )}
        <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
          <button onClick={onClose} style={{ flex: 1, background: C.grayLight, color: C.textMid, border: "none", borderRadius: 10, padding: 12, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}>ביטול</button>
          <button onClick={() => { if (!p.name.trim() || !p.outcome.trim()) return; onSave(p); onClose(); }} disabled={!p.name.trim()} style={{ flex: 2, ...btn(!p.name.trim() ? C.grayBorder : C.purple, !p.name.trim() ? C.textLight : C.white), borderRadius: 10, padding: 12, fontSize: 14, cursor: p.name.trim() ? "pointer" : "default" }}>
            {project ? "💾 שמור" : "✓ צור פרויקט"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── NextActionModal ───────────────────────────────────────────────────────────
function NextActionModal({ projects, onClose, onSave, initialProjectId }) {
  const [text, setText] = useState("");
  const [projId, setProjId] = useState(initialProjectId || "");
  const [milestoneId, setMilestoneId] = useState("");
  const [time, setTime] = useState("week");
  const [context, setContext] = useState("");
  const [estMins, setEstMins] = useState(15);
  const [energy, setEnergy] = useState("medium");
  const [hardDate, setHardDate] = useState(false);
  const [waiting, setWaiting] = useState(false);
  const [waitingFor, setWaitingFor] = useState("");
  const activeProj = projects.find(p => p.id === projId);
  const availableMilestones = activeProj?.milestones?.filter(m => !m.completed) || [];
  const save = () => {
    if (!text.trim()) return;
    onSave({ id: uid(), text: text.trim(), nextAction: text.trim(), time, projectId: projId || null, milestoneId: milestoneId || null, context, estMins, energy, hardDate, status: waiting ? "waiting" : "active", waitingFor: waiting ? waitingFor : "", completed: false, createdAt: new Date().toISOString() });
    onClose();
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 200 }} onClick={onClose}>
      <div style={{ background: C.white, borderRadius: "20px 20px 0 0", padding: 20, width: "100%", maxWidth: 500, maxHeight: "85vh", overflowY: "auto", direction: "rtl" }} onClick={e => e.stopPropagation()}>
        <div style={{ width: 40, height: 4, background: C.grayBorder, borderRadius: 2, margin: "0 auto 14px" }} />
        <div style={{ fontSize: 16, fontWeight: 800, color: C.text, marginBottom: 14 }}>▶ פעולה הבאה חדשה</div>
        <div style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 5 }}>פועל + אובייקט *</div>
          <input value={text} onChange={e => setText(e.target.value)} placeholder="לשלוח / לפתוח / להתקשר..." style={inp} autoFocus />
          <div style={{ fontSize: 11, color: C.textLight, marginTop: 4 }}>💡 כל משימה מתחילה בפועל ברור</div>
        </div>
        <div style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 6 }}>עדיפות</div>
          <div style={{ display: "flex", gap: 6 }}>
            {[{ v: "today", l: "🔴 חיוני", c: C.red }, { v: "week", l: "🟡 השבוע", c: C.amber }, { v: "someday", l: "⚪ מתישהו", c: C.gray }].map(o => (
              <button key={o.v} onClick={() => setTime(o.v)} style={{ flex: 1, padding: "6px 4px", borderRadius: 6, border: `1.5px solid ${time === o.v ? o.c : C.grayBorder}`, background: time === o.v ? o.c + "15" : C.white, color: time === o.v ? o.c : C.textLight, fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>{o.l}</button>
            ))}
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 5 }}>📍 הקשר</div>
            <Sel value={context} onChange={setContext} opts={CTX_OPTS} placeholder="בחר..." />
          </div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 5 }}>⏱️ זמן</div>
            <div style={{ display: "flex", gap: 4 }}>
              {TIME_OPTS.map(o => <button key={o.v} onClick={() => setEstMins(o.v)} style={{ flex: 1, padding: "6px 2px", borderRadius: 6, border: `1.5px solid ${estMins === o.v ? C.purple : C.grayBorder}`, background: estMins === o.v ? C.purpleLight : C.white, color: estMins === o.v ? C.purple : C.textLight, fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>{o.l}</button>)}
            </div>
          </div>
        </div>
        <div style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 5 }}>🧠 אנרגיה נדרשת</div>
          <div style={{ display: "flex", gap: 6 }}>
            {ENERGY_OPTS.map(o => <button key={o.v} onClick={() => setEnergy(o.v)} style={{ flex: 1, padding: "6px 4px", borderRadius: 6, border: `1.5px solid ${energy === o.v ? C.teal : C.grayBorder}`, background: energy === o.v ? C.tealLight : C.white, color: energy === o.v ? C.teal : C.textLight, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>{o.l}</button>)}
          </div>
        </div>
        {projects.filter(p => p.status === "active").length > 0 && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 5 }}>📁 פרויקט</div>
            <Sel value={projId} onChange={v => { setProjId(v); setMilestoneId(""); }} opts={projects.filter(p => p.status === "active").map(p => ({ v: p.id, l: p.name }))} placeholder="ללא פרויקט" />
          </div>
        )}
        {availableMilestones.length > 0 && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 5 }}>📍 אבן דרך</div>
            <Sel value={milestoneId} onChange={setMilestoneId} opts={availableMilestones.map(m => ({ v: m.id, l: m.text }))} placeholder="בחר..." />
          </div>
        )}
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <button onClick={() => setHardDate(h => !h)} style={{ flex: 1, padding: "7px 8px", borderRadius: 8, border: `1.5px solid ${hardDate ? C.red : C.grayBorder}`, background: hardDate ? C.redLight : C.white, color: hardDate ? C.red : C.textLight, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>📌 תאריך קשיח {hardDate ? "✓" : ""}</button>
          <button onClick={() => setWaiting(w => !w)} style={{ flex: 1, padding: "7px 8px", borderRadius: 8, border: `1.5px solid ${waiting ? C.amber : C.grayBorder}`, background: waiting ? C.amberLight : C.white, color: waiting ? C.amber : C.textLight, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>⏳ ממתין {waiting ? "✓" : ""}</button>
        </div>
        {waiting && <input value={waitingFor} onChange={e => setWaitingFor(e.target.value)} placeholder="ממתין ל..." style={{ ...inp, marginBottom: 12, fontSize: 13 }} />}
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onClose} style={{ flex: 1, background: C.grayLight, color: C.textMid, border: "none", borderRadius: 10, padding: 12, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}>ביטול</button>
          <button onClick={save} disabled={!text.trim()} style={{ flex: 2, ...btn(!text.trim() ? C.grayBorder : C.purple, !text.trim() ? C.textLight : C.white), borderRadius: 10, padding: 12, fontSize: 14 }}>✓ הוסף</button>
        </div>
      </div>
    </div>
  );
}

// ── ProjectsTab ───────────────────────────────────────────────────────────────
function ProjectsTab({ projects, tasks, updProjects, updTasks, setCalendarModal }) {
  const [view, setView] = useState("projects");
  const [showNewProject, setShowNewProject] = useState(false);
  const [editProject, setEditProject] = useState(null);
  const [showNewAction, setShowNewAction] = useState(false);
  const [newActionProjId, setNewActionProjId] = useState("");
  const [filterCtx, setFilterCtx] = useState("");
  const [filterEnergy, setFilterEnergy] = useState("");
  const [expandedProj, setExpandedProj] = useState(null);

  const saveProject = p => updProjects(prev => { const exists = prev.find(x => x.id === p.id); return exists ? prev.map(x => x.id === p.id ? p : x) : [...prev, p]; });
  const deleteProject = id => updProjects(prev => prev.filter(p => p.id !== id));
  const completeTask = id => updTasks(prev => prev.map(t => t.id === id ? { ...t, completed: true, completedAt: new Date().toISOString() } : t));
  const uncompleteTask = id => updTasks(prev => prev.map(t => t.id === id ? { ...t, completed: false, completedAt: null } : t));
  const deleteTask = id => updTasks(prev => prev.filter(t => t.id !== id));

  const pendingTasks = tasks.filter(t => !t.completed);
  const activeProjects = projects.filter(p => p.status === "active");
  let naList = pendingTasks;
  if (filterCtx) naList = naList.filter(t => t.context === filterCtx);
  if (filterEnergy) naList = naList.filter(t => t.energy === filterEnergy);

  const groups = [
    { id: "today", label: "🔴 חיוני עכשיו", c: C.red, tasks: naList.filter(t => t.time === "today" && t.status !== "waiting") },
    { id: "week", label: "🟡 השבוע", c: C.amber, tasks: naList.filter(t => t.time === "week" && t.status !== "waiting") },
    { id: "waiting", label: "⏳ ממתין", c: C.orange, tasks: naList.filter(t => t.status === "waiting") },
    { id: "someday", label: "⚪ מתישהו", c: C.gray, tasks: naList.filter(t => t.time === "someday" && t.status !== "waiting") },
  ].filter(g => g.tasks.length > 0);

                      )}

      )}

    </div>
  );
}

// ── CarryOverModal ────────────────────────────────────────────────────────────
function CarryOverModal({ tasks, daily, updDaily, addToInbox, onClose }) {
  const [decisions, setDecisions] = useState({});
  const decide = (key, val) => setDecisions(d => ({ ...d, [key]: val }));

  const confirm = () => {
    let newDaily = { ...daily };
    const slots = ["main", "small1", "small2"];
    const freeSlots = () => slots.filter(s => !newDaily[s]);

    tasks.forEach(({ key, text }) => {
      const d = decisions[key] || "dismiss";
      if (d === "today") {
        const slot = freeSlots()[0];
        if (slot) newDaily[slot] = text;
      } else if (d === "inbox") {
        addToInbox(text);
      }
    });
    newDaily.carryOverChecked = true;
    updDaily(newDaily);
    onClose();
  };

  const BtnGroup = ({ taskKey }) => (
    <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
      {[{ v: "today", l: "העבר להיום", c: C.purple }, { v: "inbox", l: "לאינבוקס", c: C.teal }, { v: "dismiss", l: "בטל", c: C.textLight }].map(({ v, l, c }) => (
        <button key={v} onClick={() => decide(taskKey, v)}
          style={{ flex: 1, padding: "6px 4px", fontSize: 11, fontWeight: 600, borderRadius: 8, cursor: "pointer", fontFamily: "inherit",
            background: decisions[taskKey] === v ? c + "20" : C.white,
            border: `1.5px solid ${decisions[taskKey] === v ? c : C.grayBorder}`,
            color: decisions[taskKey] === v ? c : C.textLight }}>{l}</button>
      ))}
    </div>
  );

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 12 }}>
      <div style={{ background: C.white, borderRadius: 16, padding: 20, width: "100%", maxWidth: 440, direction: "rtl" }}>
        <div style={{ fontSize: 17, fontWeight: 800, color: C.text, marginBottom: 4 }}>⚠️ משימות שלא הושלמו אתמול</div>
        <div style={{ fontSize: 12, color: C.textLight, marginBottom: 16 }}>מה לעשות עם כל אחת?</div>
        {tasks.map(({ key, label, text }) => (
          <div key={key} style={{ background: C.grayLight, borderRadius: 10, padding: 12, marginBottom: 10 }}>
            <div style={{ fontSize: 11, color: C.textLight, marginBottom: 4 }}>{label}</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{text}</div>
            <BtnGroup taskKey={key} />
          </div>
        ))}
        <button onClick={confirm} style={{ ...btn(), width: "100%", padding: "10px", fontSize: 14, marginTop: 6 }}>אישור ✓</button>
      </div>
    </div>
  );
}

// ── PlanDayModal ──────────────────────────────────────────────────────────────
function PlanDayModal({ daily, updDaily, tasks, onClose }) {
  const pending = tasks.filter(t => !t.completed && t.status !== "waiting");
  const [main, setMain] = useState(daily.main || "");
  const [small1, setSmall1] = useState(daily.small1 || "");
  const [small2, setSmall2] = useState(daily.small2 || "");
  const [searches, setSearches] = useState({ main: daily.main || "", small1: daily.small1 || "", small2: daily.small2 || "" });
  const [focused, setFocused] = useState(null);

  const setSlot = (key, val, setter) => { setter(val); setSearches(s => ({ ...s, [key]: val })); };

  const pick = (key, text, setter) => { setter(text); setSearches(s => ({ ...s, [key]: text })); setFocused(null); };

  const save = () => { updDaily({ ...daily, main, small1, small2 }); onClose(); };

  const Slot = ({ label, color, slotKey, value, setter }) => {
    const q = searches[slotKey] || "";
    const opts = pending.filter(t => !q || t.text.includes(q)).slice(0, 6);
    return (
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color, marginBottom: 6 }}>{label}</div>
        <input value={q} onChange={e => setSlot(slotKey, e.target.value, setter)}
          onFocus={() => setFocused(slotKey)} placeholder="חפש משימה או הקלד חופשי..."
          style={{ width: "100%", border: `1.5px solid ${color}50`, borderRadius: 8, padding: "8px 12px", fontSize: 13, outline: "none", fontFamily: "inherit", direction: "rtl", boxSizing: "border-box" }} />
        {focused === slotKey && opts.length > 0 && (
          <div style={{ background: C.white, border: `1px solid ${C.grayBorder}`, borderRadius: 8, marginTop: 4, overflow: "hidden" }}>
            {opts.map(t => (
              <div key={t.id} onMouseDown={() => pick(slotKey, t.text, setter)}
                style={{ padding: "8px 12px", fontSize: 13, cursor: "pointer", borderBottom: `1px solid ${C.grayLight}`, color: C.text }}>
                {t.text}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 12 }} onClick={onClose}>
      <div style={{ background: C.white, borderRadius: 16, padding: 20, width: "100%", maxWidth: 440, maxHeight: "92vh", overflowY: "auto", direction: "rtl" }} onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 17, fontWeight: 800, color: C.text, marginBottom: 4 }}>📅 תכנון היום</div>
        <div style={{ fontSize: 12, color: C.textLight, marginBottom: 18 }}>בחר מהרשימה או הקלד חופשי</div>
        <Slot label="🔵 עיקרית — המשימה הכי חשובה" color={C.purple} slotKey="main" value={main} setter={setMain} />
        <Slot label="⚫ 2 — משימה קטנה" color={C.text} slotKey="small1" value={small1} setter={setSmall1} />
        <Slot label="⚫ 3 — משימה קטנה" color={C.text} slotKey="small2" value={small2} setter={setSmall2} />
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <button onClick={save} style={{ ...btn(), flex: 1, padding: "10px", fontSize: 14 }}>שמור ✓</button>
          <button onClick={onClose} style={{ flex: 1, padding: "10px", fontSize: 14, background: C.grayLight, border: "none", borderRadius: 10, cursor: "pointer", fontFamily: "inherit", color: C.textMid }}>ביטול</button>
        </div>
      </div>
    </div>
  );
}

// ── FocusTab ──────────────────────────────────────────────────────────────────
function FocusTab({ tasks }) {
  const MODES = [
    { id: "work", label: "🍅 פוקוס", secs: 25*60, color: C.purple },
    { id: "short", label: "☕ הפסקה", secs: 5*60, color: C.green },
    { id: "long", label: "🌿 ארוכה", secs: 15*60, color: C.teal },
  ];
  const [modeId, setModeId] = useState("work");
  const [seconds, setSeconds] = useState(25*60);
  const [running, setRunning] = useState(false);
  const [sessions, setSessions] = useState(0);
  const [taskText, setTaskText] = useState("");
  const interval = useRef(null);
  const mode = MODES.find(m => m.id === modeId);
  const todayTasks = (tasks || []).filter(t => t.time === "today" && !t.completed);
  const R = 88, CIRC = 2 * Math.PI * R;
  const progress = 1 - seconds / mode.secs;

  const switchMode = m => { setModeId(m.id); setSeconds(m.secs); setRunning(false); clearInterval(interval.current); };
  const reset = () => { setRunning(false); clearInterval(interval.current); setSeconds(mode.secs); };

  useEffect(() => {
    if (running) {
      interval.current = setInterval(() => {
        setSeconds(s => {
          if (s <= 1) { clearInterval(interval.current); setRunning(false); if (modeId === "work") setSessions(p => p + 1); return 0; }
          return s - 1;
        });
      }, 1000);
    }
    return () => clearInterval(interval.current);
  }, [running, modeId]);

  return (
    <div style={{ padding: 16 }}>
      <div style={card}>
        <div style={{ display: "flex", gap: 5, marginBottom: 16 }}>
          {MODES.map(m => <button key={m.id} onClick={() => switchMode(m)} style={{ flex: 1, padding: "7px 2px", borderRadius: 8, border: `1.5px solid ${modeId === m.id ? m.color : C.grayBorder}`, background: modeId === m.id ? m.color + "12" : C.white, color: modeId === m.id ? m.color : C.textLight, fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>{m.label}</button>)}
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 18 }}>
          <svg width="210" height="210" style={{ direction: "ltr" }}>
            <circle cx="105" cy="105" r={R} fill="none" stroke={C.grayLight} strokeWidth="10" />
            <circle cx="105" cy="105" r={R} fill="none" stroke={mode.color} strokeWidth="10" strokeLinecap="round"
              strokeDasharray={CIRC} strokeDashoffset={CIRC * (1 - progress)}
              transform="rotate(-90 105 105)" style={{ transition: running ? "stroke-dashoffset 0.9s linear" : "none" }} />
            <text x="105" y="98" textAnchor="middle" fontSize="38" fontWeight="800" fill={C.text} fontFamily="inherit">{pad(Math.floor(seconds/60))}:{pad(seconds%60)}</text>
            <text x="105" y="122" textAnchor="middle" fontSize="13" fill={C.textLight} fontFamily="inherit">{mode.label}</text>
            {sessions > 0 && <text x="105" y="144" textAnchor="middle" fontSize="13" fill={mode.color} fontFamily="inherit">🍅 {sessions}</text>}
          </svg>
          <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
            <button onClick={() => setRunning(r => !r)} style={{ ...btn(running ? C.amber : mode.color), padding: "11px 28px", fontSize: 15, borderRadius: 10 }}>{running ? "⏸ עצור" : "▶ התחל"}</button>
            <button onClick={reset} style={{ background: C.grayLight, color: C.textMid, border: "none", borderRadius: 10, padding: "11px 14px", fontSize: 15, cursor: "pointer", fontFamily: "inherit" }}>↺</button>
          </div>
        </div>
        {todayTasks.length > 0 && (
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textLight, marginBottom: 6 }}>🎯 על מה אתה עובד?</div>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
              {todayTasks.slice(0, 4).map(t => <button key={t.id} onClick={() => setTaskText(t.text)} style={{ background: taskText === t.text ? C.purpleLight : C.grayLight, color: taskText === t.text ? C.purple : C.textMid, border: "none", borderRadius: 6, padding: "4px 8px", fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>{t.text.slice(0, 20)}{t.text.length > 20 ? "…" : ""}</button>)}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── MetricsTab ────────────────────────────────────────────────────────────────
function MetricsTab({ tasks, projects, inbox, daily, history }) {
  const doneToday = tasks.filter(t => t.completed && t.completedAt?.startsWith(TODAY)).length;
  const pending = tasks.filter(t => !t.completed);
  const activeProjs = projects.filter(p => p.status === "active");
  const projsWithNA = activeProjs.filter(p => pending.some(t => t.projectId === p.id && t.status !== "waiting")).length;
  const projsNAPercent = activeProjs.length > 0 ? Math.round((projsWithNA / activeProjs.length) * 100) : 100;
  const stuckTasks = pending.filter(t => daysSince(t.createdAt) > 7).length;
  const allMilestones = projects.flatMap(p => p.milestones || []);
  const doneMilestones = allMilestones.filter(m => m.completed).length;

  const kpis = [
    { label: "📁 פרויקטים עם NA", value: `${projsNAPercent}%`, good: projsNAPercent === 100, color: C.green },
    { label: "📥 אינבוקס", value: inbox.length, good: inbox.length === 0, color: C.blue },
    { label: "✅ הושלמו היום", value: doneToday, good: doneToday >= 3, color: C.purple },
    { label: "📍 מיילסטונים", value: `${doneMilestones}/${allMilestones.length}`, good: allMilestones.length > 0, color: C.teal },
    { label: "⚠️ תקועות >7י׳", value: stuckTasks, good: stuckTasks === 0, color: C.red },
    { label: "⚡ אנרגיה היום", value: `${daily.energy || 0}/5`, good: (daily.energy || 0) >= 3, color: C.purple },
    { label: "🌙 סגירה יומית", value: daily.closed ? "✓" : "—", good: daily.closed, color: C.green },
    { label: "📝 סה״כ משימות", value: tasks.length, good: true, color: C.gray },
  ];

  const chartData = history.slice(-7).map(d => ({ date: d.date.slice(5).replace("-", "/"), done: d.done || 0, energy: d.energy || 0 }));

  return (
    <div style={{ padding: 16 }}>
      <div style={card}>
        <div style={{ fontSize: 14, fontWeight: 700, color: C.text, marginBottom: 14 }}>📊 מדדי מערכת</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          {kpis.map(m => (
            <div key={m.label} style={{ background: m.good ? m.color + "0D" : C.redLight, borderRadius: 10, padding: "10px 12px", border: `1px solid ${m.good ? m.color + "25" : C.red + "40"}` }}>
              <div style={{ fontSize: 10, color: C.textLight, marginBottom: 3 }}>{m.label}</div>
              <div style={{ fontSize: 20, fontWeight: 800, color: m.good ? m.color : C.red }}>{m.value}</div>
            </div>
          ))}
        </div>
      </div>

      {LineChart && chartData.length >= 2 ? (
        <div style={card}>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 12 }}>📈 7 ימים — משימות ואנרגיה</div>
          <ResponsiveContainer width="100%" height={150}>
            <LineChart data={chartData} margin={{ top: 4, right: 8, bottom: 4, left: -20 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.grayBorder} />
              <XAxis dataKey="date" tick={{ fontSize: 10, fill: C.textLight }} />
              <YAxis tick={{ fontSize: 10, fill: C.textLight }} />
              <Tooltip contentStyle={{ fontSize: 11, borderRadius: 8 }} />
              <Line type="monotone" dataKey="done" name="משימות" stroke={C.purple} strokeWidth={2.5} dot={{ r: 3 }} />
              <Line type="monotone" dataKey="energy" name="אנרגיה" stroke={C.amber} strokeWidth={2} dot={{ r: 3 }} strokeDasharray="5 3" />
            </LineChart>
          </ResponsiveContainer>
        </div>
      ) : (
        <div style={{ ...card, textAlign: "center", padding: 28 }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📊</div>
          <div style={{ fontSize: 13, color: C.textLight }}>גרפים יופיעו לאחר 2 ימי שימוש</div>
        </div>
      )}

      <div style={{ ...card, background: C.purpleLight, border: `1px solid ${C.purple}20` }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.purple, marginBottom: 6 }}>💡 עקרונות מפתח</div>
        <div style={{ fontSize: 12, color: C.textMid, lineHeight: 1.8 }}>
          ✓ כל פרויקט = תוצאה ברורה + פעולה הבאה חיה<br />
          ✓ פרויקט ללא Next Action = "דקורציה"<br />
          ✓ זמן עיבוד אינבוקס &lt; 48 שעות<br />
          ✓ יומן = רק מה שקשור לזמן
        </div>
      </div>
    </div>
  );
}

// ── WeeklyReviewModal ─────────────────────────────────────────────────────────
function WeeklyReviewModal({ inbox, tasks, projects, onClose, onNav }) {
  const [step, setStep] = useState(0);
  const pending = tasks.filter(t => !t.completed);
  const doneThisWeek = tasks.filter(t => t.completedAt && Date.now() - new Date(t.completedAt) < 7*24*60*60*1000).length;
  const activeProjs = projects.filter(p => p.status === "active");
  const projsNoNA = activeProjs.filter(p => !pending.some(t => t.projectId === p.id && t.status !== "waiting"));

  const STEPS = [
    { icon: "📥", title: "שלב 1: נקה את האינבוקס", content: <div>
      <div style={{ background: inbox.length === 0 ? C.greenLight : C.amberLight, borderRadius: 12, padding: 20, textAlign: "center", marginBottom: 12 }}>
        <div style={{ fontSize: 36, marginBottom: 8 }}>{inbox.length === 0 ? "🎉" : "📥"}</div>
        <div style={{ fontSize: 15, fontWeight: 700, color: inbox.length === 0 ? C.green : C.amber }}>{inbox.length === 0 ? "האינבוקס ריק!" : `${inbox.length} פריטים לעיבוד`}</div>
      </div>
      {inbox.length > 0 && <button onClick={() => { onClose(); onNav("inbox"); }} style={{ width: "100%", ...btn(), borderRadius: 10, padding: 11 }}>📥 עבור לאינבוקס →</button>}
    </div> },
    { icon: "📁", title: "שלב 2: בדוק פרויקטים", content: <div>
      {projsNoNA.length > 0 && <div style={{ background: C.redLight, borderRadius: 8, padding: 10, marginBottom: 10 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: C.red, marginBottom: 4 }}>🚨 ללא פעולה הבאה (דקורציה!):</div>
        {projsNoNA.map(p => <div key={p.id} style={{ fontSize: 12, color: C.red }}>• {p.name}</div>)}
      </div>}
      <div style={{ background: C.greenLight, borderRadius: 8, padding: 10, fontSize: 13, color: C.green, fontWeight: 600 }}>✅ הושלמו השבוע: {doneThisWeek} פעולות</div>
      <button onClick={() => { onClose(); onNav("projects"); }} style={{ width: "100%", ...btn(C.purpleMid), borderRadius: 10, padding: 10, marginTop: 10, fontSize: 13 }}>עבור לפרויקטים →</button>
    </div> },
    { icon: "🎯", title: "שלב 3: 3 מטרות לשבוע הבא", content: <div>
      <div style={{ fontSize: 12, color: C.textLight, marginBottom: 12 }}>מה חיוני? בחר 3 בלבד</div>
      {["עיקרית", "שנייה", "שלישית"].map((l, i) => (
        <div key={i} style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: i === 0 ? C.purple : C.textLight, marginBottom: 5 }}>{i === 0 ? "🔵" : "⚫"} {l}</div>
          <input placeholder={`מטרה ${i + 1}...`} style={{ ...inp, border: `1.5px solid ${i === 0 ? C.purple + "40" : C.grayBorder}` }} />
        </div>
      ))}
      <div style={{ background: C.greenLight, borderRadius: 10, padding: 14, marginTop: 10, textAlign: "center" }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: C.green }}>🎉 הסקירה הושלמה!</div>
      </div>
    </div> }
  ];
  const s = STEPS[step];
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 150, padding: 16 }} onClick={onClose}>
      <div style={{ background: C.white, borderRadius: 16, padding: 22, width: "100%", maxWidth: 460, maxHeight: "90vh", overflowY: "auto", direction: "rtl" }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", gap: 5, marginBottom: 18 }}>{STEPS.map((_, i) => <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= step ? C.purple : C.grayBorder }} />)}</div>
        <div style={{ fontSize: 26, marginBottom: 5 }}>{s.icon}</div>
        <div style={{ fontSize: 16, fontWeight: 800, color: C.text, marginBottom: 16 }}>{s.title}</div>
        {s.content}
        <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
          {step > 0 && <button onClick={() => setStep(s => s - 1)} style={{ flex: 1, background: C.grayLight, color: C.textMid, border: "none", borderRadius: 10, padding: 12, fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}>← חזור</button>}

        </div>
      </div>
    </div>
  );
}

// ── AdminPinScreen ────────────────────────────────────────────────────────────
function AdminPinScreen({ onSuccess, onBack }) {
  const [pin, setPin] = useState("");
  const [adminPin, setAdminPin] = useState(null);
  const [error, setError] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    ref.current?.focus();
    _db.ref("adhd/_admin/adminPin").once("value", snap => {
      setAdminPin(snap.exists() ? snap.val() : "0000");
    });
  }, []);

  const check = p => {
    const correct = adminPin || "0000";
    if (p === correct) { onSuccess(); }
    else if (p.length === 4) { setError(true); setTimeout(() => { setError(false); setPin(""); }, 800); }
  };
  const press = d => { const next = pin + d; setPin(next); if (next.length === 4 && adminPin !== null) check(next); };
  const handleKey = e => {
    if (e.key >= "0" && e.key <= "9") press(e.key);
    else if (e.key === "Backspace") setPin(p => p.slice(0, -1));
    else if (e.key === "Escape") onBack();
  };

  return (
    <div onKeyDown={handleKey} tabIndex={0} ref={ref} style={{ minHeight: "100vh", background: "linear-gradient(160deg,#0f172a 0%,#1e1b4b 60%,#0f172a 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 28, fontFamily: "'Segoe UI',Tahoma,sans-serif", outline: "none" }}>
      <div style={{ fontSize: 22, fontWeight: 700, color: "#94a3b8" }}>🔧 כניסת מנהל</div>
      <div style={{ display: "flex", gap: 12, marginBottom: 4 }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{ width: 16, height: 16, borderRadius: "50%", background: pin.length > i ? (error ? "#f87171" : "#94a3b8") : "#1e293b", border: `2px solid ${error ? "#f87171" : "#334155"}`, transition: "all 0.15s" }} />
        ))}
      </div>
      {error && <div style={{ color: "#f87171", fontSize: 13, marginTop: -16 }}>קוד שגוי</div>}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 70px)", gap: 10, direction: "ltr" }}>
        {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d, i) => (
          <button key={i} onClick={() => { if (d === "⌫") setPin(p => p.slice(0,-1)); else if (d !== "") press(String(d)); }}
            style={{ height: 70, borderRadius: 14, border: "1px solid #1e293b", background: d === "" ? "transparent" : "#0f172a", color: d === "⌫" ? "#f87171" : "#94a3b8", fontSize: d === "⌫" ? 20 : 24, fontWeight: 600, cursor: d === "" ? "default" : "pointer", fontFamily: "inherit" }}>
            {d}
          </button>
        ))}
      </div>
      <button onClick={onBack} style={{ background: "transparent", border: "none", color: "#334155", fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>← חזור</button>
    </div>
  );
}

// ── AdminPanel ────────────────────────────────────────────────────────────────
function AdminPanel({ onBack }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newMatanPin, setNewMatanPin] = useState("");
  const [newAdminPin, setNewAdminPin] = useState("");
  const [saved, setSaved] = useState("");
  const [newUsername, setNewUsername] = useState("");
  const [newUserPin, setNewUserPin] = useState("");
  const [managedUsers, setManagedUsers] = useState(null);
  const [confirmAction, setConfirmAction] = useState(null); // { label, onConfirm }

  useEffect(() => {
    _db.ref("adhd").once("value", snap => {
      if (!snap.exists()) { setLoading(false); return; }
      const data = snap.val();
      const userList = Object.keys(data).filter(k => k !== "_admin").map(username => {
        const udata = data[username];
        const tasks = udata["adhd-tasks-v1"] ? (Array.isArray(udata["adhd-tasks-v1"]) ? udata["adhd-tasks-v1"] : Object.values(udata["adhd-tasks-v1"])) : [];
        const inbox = udata["adhd-inbox-v1"] ? (Array.isArray(udata["adhd-inbox-v1"]) ? udata["adhd-inbox-v1"] : Object.values(udata["adhd-inbox-v1"])) : [];
        const projects = udata["adhd-projects-v1"] ? (Array.isArray(udata["adhd-projects-v1"]) ? udata["adhd-projects-v1"] : Object.values(udata["adhd-projects-v1"])) : [];
        const history = udata["adhd-history-v1"] ? (Array.isArray(udata["adhd-history-v1"]) ? udata["adhd-history-v1"] : Object.values(udata["adhd-history-v1"])) : [];
        const lastActive = history.length > 0 ? history[history.length - 1].date : "—";
        return { username, tasks: tasks.length, inbox: inbox.length, projects: projects.length, completedTasks: tasks.filter(t => t.completed).length, lastActive };
      });
      setUsers(userList);
      setLoading(false);
    });
  }, []);

  useEffect(() => {
    _db.ref("adhd/_admin/users").once("value", snap => {
      if (snap.exists()) {
        setManagedUsers(snap.val());
      } else {
        setManagedUsers({ matan: { pin: null }, guest: { pin: null } });
      }
    });
  }, []);

  const savePin = async (type) => {
    const val = type === "matan" ? newMatanPin : newAdminPin;
    if (val.length !== 4 || isNaN(val)) return;
    const path = type === "matan" ? "adhd/_admin/matanPin" : "adhd/_admin/adminPin";
    await _db.ref(path).set(val);
    setSaved(type === "matan" ? "PIN של מתן עודכן ✓" : "PIN מנהל עודכן ✓");
    setTimeout(() => setSaved(""), 2500);
    if (type === "matan") setNewMatanPin(""); else setNewAdminPin("");
  };

  const requireAdminPin = (label, action) => {
    setConfirmAction({ label, onConfirm: () => { setConfirmAction(null); action(); } });
  };

  const resetSession = username => {
    localStorage.removeItem("adhd_pin_ok");
    setSaved(`סשן ${username} אופס ✓`);
    setTimeout(() => setSaved(""), 2500);
  };

  const addUser = async () => {
    const uname = newUsername.trim().toLowerCase().replace(/\s+/g,"_");
    if (!uname) return;
    const pinVal = newUserPin.length === 4 ? newUserPin : null;
    const updated = { ...(managedUsers || {}), [uname]: { pin: pinVal } };
    await _db.ref("adhd/_admin/users").set(updated);
    setManagedUsers(updated);
    setNewUsername(""); setNewUserPin("");
    setSaved(`משתמש "${uname}" נוסף ✓`);
    setTimeout(() => setSaved(""), 2500);
  };

  const deleteUser = async (uname) => {
    const updated = { ...(managedUsers || {}) };
    delete updated[uname];
    await _db.ref("adhd/_admin/users").set(updated);
    setManagedUsers(updated);
    setSaved(`משתמש "${uname}" נמחק ✓`);
    setTimeout(() => setSaved(""), 2500);
  };

  return (
    <div style={{ minHeight: "100vh", background: "#0f172a", fontFamily: "'Segoe UI',Tahoma,sans-serif", direction: "rtl", color: "#e2e8f0", paddingBottom: 40 }}>
      {confirmAction && <AdminConfirmPin label={confirmAction.label} onConfirm={confirmAction.onConfirm} onCancel={() => setConfirmAction(null)} />}

      <div style={{ background: "#1e293b", padding: "14px 18px", borderBottom: "1px solid #334155", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: "#94a3b8" }}>🔧 פאנל ניהול</div>
        <button onClick={onBack} style={{ background: "#334155", border: "none", borderRadius: 8, padding: "6px 14px", color: "#94a3b8", fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>← יציאה</button>
      </div>

      <div style={{ padding: 16, maxWidth: 500, margin: "0 auto" }}>
        {saved && <div style={{ background: "#166534", borderRadius: 10, padding: "10px 14px", marginBottom: 12, fontSize: 13, color: "#4ade80" }}>{saved}</div>}

        {/* Users stats */}
        <div style={{ background: "#1e293b", borderRadius: 14, padding: 16, marginBottom: 12, border: "1px solid #334155" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#94a3b8", marginBottom: 14 }}>👥 סטטיסטיקות משתמשים</div>
          {loading ? <div style={{ color: "#475569", fontSize: 13 }}>טוען...</div> : users.length === 0 ? <div style={{ color: "#475569", fontSize: 13 }}>אין נתונים עדיין</div> : users.map(u => (
            <div key={u.username} style={{ background: "#0f172a", borderRadius: 10, padding: "12px 14px", marginBottom: 8, border: "1px solid #334155" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#c4b5fd" }}>👤 {u.username}</div>
                <div style={{ fontSize: 11, color: "#475569" }}>פעיל לאחרונה: {u.lastActive}</div>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6, marginBottom: 8 }}>
                {[["משימות", u.tasks, "#a78bfa"], ["הושלמו", u.completedTasks, "#4ade80"], ["פרויקטים", u.projects, "#60a5fa"], ["אינבוקס", u.inbox, "#fb923c"]].map(([l,v,c]) => (
                  <div key={l} style={{ textAlign: "center", background: "#1e293b", borderRadius: 8, padding: "6px 4px" }}>
                    <div style={{ fontSize: 16, fontWeight: 700, color: c }}>{v}</div>
                    <div style={{ fontSize: 10, color: "#475569" }}>{l}</div>
                  </div>
                ))}
              </div>
              <button onClick={() => requireAdminPin(`אפס סשן של "${u.username}"?`, () => resetSession(u.username))}
                style={{ background: "#334155", border: "none", borderRadius: 7, padding: "5px 12px", color: "#94a3b8", fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>🔄 אפס סשן</button>
            </div>
          ))}
        </div>

        {/* Manage Users */}
        <div style={{ background: "#1e293b", borderRadius: 14, padding: 16, marginBottom: 12, border: "1px solid #334155" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#94a3b8", marginBottom: 14 }}>➕ ניהול משתמשים</div>
          {managedUsers && Object.keys(managedUsers).map(uname => (
            <div key={uname} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#0f172a", borderRadius: 8, padding: "8px 12px", marginBottom: 6, border: "1px solid #334155" }}>
              <div style={{ fontSize: 13, color: "#c4b5fd" }}>👤 {uname}</div>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <div style={{ fontSize: 11, color: "#475569" }}>{managedUsers[uname].pin ? "🔒 PIN" : "🔓 ללא PIN"}</div>
                {uname !== "matan" && (
                  <button onClick={() => requireAdminPin(`למחוק את המשתמש "${uname}"?`, () => deleteUser(uname))}
                    style={{ background: "#7f1d1d", border: "none", borderRadius: 6, padding: "4px 10px", color: "#fca5a5", fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>מחק</button>
                )}
              </div>
            </div>
          ))}
          <div style={{ marginTop: 12, fontSize: 12, color: "#64748b", marginBottom: 8 }}>הוסף משתמש חדש:</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input value={newUsername} onChange={e => setNewUsername(e.target.value)} placeholder="שם משתמש"
              style={{ flex: 1, background: "#0f172a", border: "1px solid #334155", borderRadius: 8, padding: "9px 12px", color: "#e2e8f0", fontSize: 13, outline: "none", fontFamily: "inherit" }} />
            <input value={newUserPin} onChange={e => setNewUserPin(e.target.value.replace(/\D/g,"").slice(0,4))} placeholder="PIN (אופציונלי)" maxLength={4} inputMode="numeric"
              style={{ width: 100, background: "#0f172a", border: "1px solid #334155", borderRadius: 8, padding: "9px 12px", color: "#e2e8f0", fontSize: 13, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
          </div>
          <button onClick={addUser} disabled={!newUsername.trim()} style={{ background: newUsername.trim() ? "#065f46" : "#334155", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newUsername.trim() ? "pointer" : "default", fontFamily: "inherit", width: "100%" }}>➕ הוסף משתמש</button>
        </div>

        {/* Reset Matan PIN */}
        <div style={{ background: "#1e293b", borderRadius: 14, padding: 16, marginBottom: 12, border: "1px solid #334155" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#94a3b8", marginBottom: 12 }}>🔑 שנה PIN של Matan</div>
          <div style={{ display: "flex", gap: 8 }}>
            <input value={newMatanPin} onChange={e => setNewMatanPin(e.target.value.replace(/\D/g,"").slice(0,4))}
              placeholder="4 ספרות חדשות" maxLength={4} inputMode="numeric"
              style={{ flex: 1, background: "#0f172a", border: "1px solid #334155", borderRadius: 8, padding: "9px 12px", color: "#e2e8f0", fontSize: 14, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
            <button onClick={() => savePin("matan")} disabled={newMatanPin.length !== 4} style={{ background: newMatanPin.length === 4 ? "#6d28d9" : "#334155", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newMatanPin.length === 4 ? "pointer" : "default", fontFamily: "inherit" }}>שמור</button>
          </div>
        </div>

        {/* Change Admin PIN */}
        <div style={{ background: "#1e293b", borderRadius: 14, padding: 16, border: "1px solid #334155" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#94a3b8", marginBottom: 12 }}>🔧 שנה PIN מנהל</div>
          <div style={{ display: "flex", gap: 8 }}>
            <input value={newAdminPin} onChange={e => setNewAdminPin(e.target.value.replace(/\D/g,"").slice(0,4))}
              placeholder="4 ספרות חדשות" maxLength={4} inputMode="numeric"
              style={{ flex: 1, background: "#0f172a", border: "1px solid #334155", borderRadius: 8, padding: "9px 12px", color: "#e2e8f0", fontSize: 14, outline: "none", direction: "ltr", fontFamily: "inherit" }} />
            <button onClick={() => savePin("admin")} disabled={newAdminPin.length !== 4} style={{ background: newAdminPin.length === 4 ? "#1d4ed8" : "#334155", border: "none", borderRadius: 8, padding: "9px 16px", color: "#fff", fontWeight: 700, fontSize: 13, cursor: newAdminPin.length === 4 ? "pointer" : "default", fontFamily: "inherit" }}>שמור</button>
          </div>
          <div style={{ fontSize: 11, color: "#475569", marginTop: 8 }}>PIN ברירת מחדל: 0000</div>
        </div>
      </div>
    </div>
  );
}

function PinScreen({ onSuccess, onBack, username, correctPin }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); }, []);

  const check = p => {
    if (p === correctPin) { onSuccess(); }
    else if (p.length === 4) { setError(true); setTimeout(() => { setError(false); setPin(""); }, 800); }
  };
  const press = d => { const next = pin + d; setPin(next); if (next.length === 4) check(next); };
  const handleKey = e => {
    if (e.key >= "0" && e.key <= "9") press(e.key);
    else if (e.key === "Backspace") setPin(p => p.slice(0, -1));
    else if (e.key === "Escape") onBack();
  };

  const displayName = username ? username.charAt(0).toUpperCase() + username.slice(1) : "משתמש";

  return (
    <div onKeyDown={handleKey} tabIndex={0} ref={ref} style={{ minHeight: "100vh", background: "linear-gradient(160deg,#1e1b4b 0%,#4c1d95 60%,#1e1b4b 100%)", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 28, fontFamily: "'Segoe UI',Tahoma,sans-serif", outline: "none" }}>
      <div style={{ fontSize: 22, fontWeight: 700, color: "#c4b5fd" }}>👤 {displayName}</div>
      <div style={{ display: "flex", gap: 12, marginBottom: 4 }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{ width: 16, height: 16, borderRadius: "50%", background: pin.length > i ? (error ? "#f87171" : "#a78bfa") : "#4c1d95", border: `2px solid ${error ? "#f87171" : "#7c3aed"}`, transition: "all 0.15s" }} />
        ))}
      </div>
      {error && <div style={{ color: "#f87171", fontSize: 13, marginTop: -16 }}>קוד שגוי</div>}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 70px)", gap: 10, direction: "ltr" }}>
        {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d, i) => (
          <button key={i} onClick={() => { if (d === "⌫") setPin(p => p.slice(0,-1)); else if (d !== "") press(String(d)); }}
            style={{ height: 70, borderRadius: 14, border: "1px solid #4c1d95", background: d === "" ? "transparent" : "#2e1065", color: d === "⌫" ? "#f87171" : "#c4b5fd", fontSize: d === "⌫" ? 20 : 24, fontWeight: 600, cursor: d === "" ? "default" : "pointer", fontFamily: "inherit" }}
            onTouchStart={e => { if (d !== "") e.currentTarget.style.background = "#4c1d95"; }}
            onTouchEnd={e => { if (d !== "") e.currentTarget.style.background = "#2e1065"; }}>
            {d}
          </button>
        ))}
      </div>
      <button onClick={onBack} style={{ background: "transparent", border: "none", color: "#6d28d9", fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>← חזור</button>
    </div>
  );
}

// ── ADHDApp (root) ────────────────────────────────────────────────────────────
function ADHDApp({ logout }) {

  const [tab, setTab] = useState("today");
  const [inbox, setInbox] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [projects, setProjects] = useState([]);
  const [daily, setDaily] = useState({ energy: 0, sleep: 0, meds: null, exercised: null, closed: false, main: "", small1: "", small2: "", mainDone: false, small1Done: false, small2Done: false });
  const [settings, setSettings] = useState({ morningTime: "08:00", eveningTime: "21:30", notif: false });
  const [history, setHistory] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [processItem, setProcessItem] = useState(null);
  const [recovery, setRecovery] = useState(false);
  const [weeklyReview, setWeeklyReview] = useState(false);
  const [carryOverTasks, setCarryOverTasks] = useState([]);

  useEffect(() => {
    async function init() {
      const [i, t, p, d, se, h] = await Promise.all([
        sget("adhd-inbox-v1", []),
        sget("adhd-tasks-v1", []),
        sget("adhd-projects-v1", []),
        sget(`adhd-daily-v1-${TODAY}`, { energy: 0, sleep: 0, meds: null, exercised: null, closed: false, main: "", small1: "", small2: "", mainDone: false, small1Done: false, small2Done: false }),
        sget("adhd-settings-v1", { morningTime: "08:00", eveningTime: "21:30", notif: false }),
        sget("adhd-history-v1", []),
      ]);
      setInbox(i); setTasks(t); setProjects(p); setDaily(d); setSettings(se); setHistory(h);
      if (!d.carryOverChecked) {
        const yd = await sget(`adhd-daily-v1-${YESTERDAY}`, {});
        const pending = [
          { key: "main", label: "🔵 עיקרית", text: yd.main, done: yd.mainDone },
          { key: "small1", label: "⚫ 2", text: yd.small1, done: yd.small1Done },
          { key: "small2", label: "⚫ 3", text: yd.small2, done: yd.small2Done },
        ].filter(x => x.text && !x.done);
        if (pending.length > 0) setCarryOverTasks(pending);
      }
      setLoaded(true);
    }
    init();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const doneToday = tasks.filter(t => t.completed && t.completedAt?.startsWith(TODAY)).length;
    const snap = { date: TODAY, done: doneToday, inbox: inbox.length, energy: daily.energy || 0, closed: daily.closed };
    const updated = [...history.filter(h => h.date !== TODAY), snap].sort((a, b) => a.date.localeCompare(b.date)).slice(-30);
    setHistory(updated);
    sset("adhd-history-v1", updated);
  }, [loaded, daily.energy, daily.closed, tasks.length]);

  const updInbox = v => { const val = typeof v === "function" ? v(inbox) : v; setInbox(val); sset("adhd-inbox-v1", val); };
  const updTasks = v => setTasks(prev => { const val = typeof v === "function" ? v(prev) : v; sset("adhd-tasks-v1", val); return val; });
  const updProjects = v => setProjects(prev => { const val = typeof v === "function" ? v(prev) : v; sset("adhd-projects-v1", val); return val; });
  const updDaily = v => { setDaily(v); sset(`adhd-daily-v1-${TODAY}`, v); };
  const updSettings = v => { setSettings(v); sset("adhd-settings-v1", v); };

  const addToInbox = text => updInbox([{ id: uid(), text, ts: new Date().toISOString() }, ...inbox]);
  const completeTask = id => updTasks(prev => prev.map(t => t.id === id ? { ...t, completed: true, completedAt: new Date().toISOString() } : t));

  const processInboxItem = (item, decision) => {
    updInbox(inbox.filter(i => i.id !== item.id));
    if (decision.type === "task") {
      let finalProjectId = null;
      if (decision.isProject) {
        const newProj = { id: uid(), name: item.text, outcome: "", done_definition: "", why: "", deadline: "", not_in_scope: "", blockers: "", reference: "", status: "active", milestones: [], createdAt: new Date().toISOString() };
        finalProjectId = newProj.id;
        const updatedProjs = [...projects, newProj];
        setProjects(updatedProjs);
        sset("adhd-projects-v1", updatedProjs);
      }
      const newTask = { id: uid(), text: decision.nextAction || item.text, nextAction: decision.nextAction || item.text, time: decision.time || "week", projectId: finalProjectId, context: decision.context || "", estMins: decision.estMins || 15, energy: decision.energy || "medium", status: "active", completed: false, createdAt: new Date().toISOString() };
      const updatedTasks = [...tasks, newTask];
      setTasks(updatedTasks);
      sset("adhd-tasks-v1", updatedTasks);
    }
  };

  const projsNoNA = projects.filter(p => p.status === "active" && !tasks.some(t => t.projectId === p.id && !t.completed && t.status !== "waiting")).length;

  const TABS = [
    { id: "today", label: "היום", icon: "🎯" },
    { id: "inbox", label: "אינבוקס", icon: "📥", badge: inbox.length },
    { id: "projects", label: "פרויקטים", icon: "📁", badge: projsNoNA },
    { id: "focus", label: "פוקוס", icon: "⏱️" },
    { id: "metrics", label: "מדדים", icon: "📊" },
    { id: "settings", label: "הגדרות", icon: "⚙️" },
  ];

  if (!loaded) return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100vh", background: C.bg, fontFamily: "system-ui" }}>
      <div style={{ fontSize: 52, marginBottom: 16 }}>🧠</div>
      <div style={{ color: C.textLight, fontSize: 15 }}>טוען...</div>
    </div>
  );

  return (
    <div dir="rtl" style={{ fontFamily: "'Segoe UI', system-ui, sans-serif", background: C.bg, minHeight: "100vh", maxWidth: 500, margin: "0 auto" }}>
      <div style={{ background: "linear-gradient(135deg, #4338CA, #7C3AED)", color: C.white, padding: "14px 18px 11px", position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 800 }}>🧠 מערכת ADHD</div>
            <div style={{ fontSize: 11, opacity: 0.85 }}>{new Date().toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" })}</div>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={() => setRecovery(true)} style={{ background: "rgba(255,255,255,0.2)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 8, padding: "6px 12px", color: C.white, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>🔄 חזרה למסלול</button>
            <button onClick={logout} style={{ background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 8, padding: "6px 10px", color: C.white, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>🚪</button>
          </div>
        </div>
      </div>

      <div style={{ paddingBottom: 72 }}>
        {tab === "today"    && <TodayTab daily={daily} updDaily={updDaily} tasks={tasks} projects={projects} completeTask={completeTask} setTab={setTab} setWeeklyReview={setWeeklyReview} setCalendarModal={() => {}} />}
        {tab === "inbox"    && <InboxTab inbox={inbox} addToInbox={addToInbox} setProcessItem={setProcessItem} updInbox={updInbox} />}
        {tab === "projects" && <ProjectsTab projects={projects} tasks={tasks} updProjects={updProjects} updTasks={updTasks} setCalendarModal={null} />}
        {tab === "focus"    && <FocusTab tasks={tasks} />}
        {tab === "metrics"  && <MetricsTab tasks={tasks} projects={projects} inbox={inbox} daily={daily} history={history} />}
        {tab === "settings" && <SettingsTab settings={settings} updSettings={updSettings} tasks={tasks} inbox={inbox} projects={projects} updTasks={updTasks} updInbox={updInbox} updProjects={updProjects} setWeeklyReview={setWeeklyReview} />}
      </div>

      <nav style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 500, background: C.white, borderTop: `1px solid ${C.grayBorder}`, display: "flex", zIndex: 20 }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: 1, border: "none", background: "none", cursor: "pointer", padding: "7px 2px 9px", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, position: "relative", fontFamily: "inherit" }}>
            <span style={{ fontSize: 17, opacity: tab === t.id ? 1 : 0.45 }}>{t.icon}</span>
            <span style={{ fontSize: 9, fontWeight: tab === t.id ? 700 : 400, color: tab === t.id ? "#4338CA" : C.textLight }}>{t.label}</span>
            {t.badge > 0 && <div style={{ position: "absolute", top: 4, right: "50%", marginRight: -14, background: C.red, borderRadius: "50%", width: 15, height: 15, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: C.white }}>{t.badge > 9 ? "9+" : t.badge}</div>}
          </button>
        ))}
      </nav>

      {processItem && <ProcessModal item={processItem} projects={projects} onClose={() => setProcessItem(null)} onProcess={(item, dec) => { processInboxItem(item, dec); setProcessItem(null); }} />}
      {recovery && <RecoveryModal tasks={tasks} projects={projects} onClose={() => setRecovery(false)} onNav={t => { setRecovery(false); setTab(t); }} />}
      {weeklyReview && <WeeklyReviewModal inbox={inbox} tasks={tasks} projects={projects} onClose={() => setWeeklyReview(false)} onNav={t => { setWeeklyReview(false); setTab(t); }} />}
      {carryOverTasks.length > 0 && <CarryOverModal tasks={carryOverTasks} daily={daily} updDaily={updDaily} addToInbox={text => updInbox([{ id: uid(), text, ts: new Date().toISOString() }, ...inbox])} onClose={() => setCarryOverTasks([])} />}
    </div>
  );
}

function Root() {
  const [activeUser, setActiveUser] = useState(localStorage.getItem("adhd_active_user") || null);
  const [pinOk, setPinOk] = useState(localStorage.getItem("adhd_pin_ok") === "1");
  const [adminMode, setAdminMode] = useState(false);
  const [adminAuthed, setAdminAuthed] = useState(false);
  const [userPin, setUserPin] = useState(null);
  const [pinChecked, setPinChecked] = useState(false);

  useEffect(() => {
    if (!activeUser) { setPinChecked(false); setUserPin(null); return; }
    _db.ref(`adhd/_admin/users/${activeUser}`).once("value", snap => {
      if (snap.exists() && snap.val().pin) {
        setUserPin(snap.val().pin);
      } else if (activeUser === "matan") {
        _db.ref("adhd/_admin/matanPin").once("value", s => {
          setUserPin(s.exists() ? s.val() : CORRECT_PIN);
        });
      } else {
        setUserPin(null);
      }
      setPinChecked(true);
    });
  }, [activeUser]);

  const selectUser = u => { localStorage.setItem("adhd_active_user", u); localStorage.removeItem("adhd_pin_ok"); setPinOk(false); setPinChecked(false); setActiveUser(u); };
  const logout = () => { localStorage.removeItem("adhd_active_user"); localStorage.removeItem("adhd_pin_ok"); setActiveUser(null); setPinOk(false); setPinChecked(false); setUserPin(null); };

  if (adminMode && !adminAuthed) return <AdminPinScreen onSuccess={() => setAdminAuthed(true)} onBack={() => setAdminMode(false)} />;
  if (adminMode && adminAuthed) return <AdminPanel onBack={() => { setAdminMode(false); setAdminAuthed(false); }} />;
  if (!activeUser) return <UserSelect onSelect={selectUser} onAdmin={() => setAdminMode(true)} />;
  if (!pinChecked) return <div style={{ minHeight: "100vh", background: "linear-gradient(160deg,#1e1b4b 0%,#4c1d95 60%,#1e1b4b 100%)", display: "flex", alignItems: "center", justifyContent: "center", color: "#6d28d9", fontSize: 16 }}>טוען...</div>;
  if (userPin && !pinOk) return <PinScreen username={activeUser} correctPin={userPin} onSuccess={() => { localStorage.setItem("adhd_pin_ok","1"); setPinOk(true); }} onBack={() => { localStorage.removeItem("adhd_active_user"); setActiveUser(null); }} />;
  USER = activeUser;
  return <ADHDApp logout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
